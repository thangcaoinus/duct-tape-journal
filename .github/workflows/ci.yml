name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint is advisory — surfaces warnings without failing the build (see
      # eslint.config.js). Remove `continue-on-error` to make it a hard gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # The safety-spine + helper tests. Hermetic by construction: NODE_ENV=test
      # short-circuits the sentiment model entirely (getSentimentPipe returns null),
      # so finalize is instant and the tests exercise the graceful null-sentiment
      # contract — no model load, no network, no cold-start flakiness. The OFFLINE
      # flags are belt-and-suspenders in case any code path reaches transformers.
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"

      - name: Build
        run: npx vite build
